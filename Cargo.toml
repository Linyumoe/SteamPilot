[package]
name = "steampilot"
version = "0.1.0"
description = "SteamPilot - Steam/GitHub/Epic 网页加速与 CDN 优选工具"
authors = ["SteamPilot"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "steampilot_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# M0/M1 核心链路：异步 + TLS 拦截 + 本地 CA 签发
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

# 系统代理 + PAC 接管：写 Internet Settings 并即时刷新 WinINET
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Networking_WinInet", "Win32_System_Registry", "Win32_Security_Cryptography"] }

# 发布版按体积优化：去掉调试符号、开 LTO、缩小代码
[profile.release]
opt-level = "s"      # 优先体积
lto = true           # 全程序优化，能裁掉未用代码
codegen-units = 1    # 单单元，优化更彻底
strip = true         # 剥离 DWARF 调试符号（debug 版体积大头）
panic = "abort"      # 去掉 unwind 展开表
