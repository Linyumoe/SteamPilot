name: Release

# 打 v* tag 时构建 Windows 产物并发布到 GitHub Releases。
# 供客户端「检查更新」读取 releases/latest，因此tag 用 v0.1.0 这种纯三段版本号。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # gh release create 需要写权限

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release exe
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target\release\steampilot.exe dist\SteamPilot.exe
          Copy-Item README.md dist\README.md
          Compress-Archive -Path dist\* -DestinationPath "SteamPilot-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create ${{ github.ref_name }} "SteamPilot-${{ github.ref_name }}-win-x64.zip" --title "SteamPilot ${{ github.ref_name }}" --generate-notes
