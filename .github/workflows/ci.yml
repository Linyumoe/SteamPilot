name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# audit-check 需要创建 check run；不给写权限会在末尾报 Resource not accessible。
permissions:
  contents: read
  checks: write

# windows-latest 与目标平台一致，避免 Linux 下 webkit2gtk 等 Tauri 系统依赖。
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Tests
        run: cargo test --release

      - name: Security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
